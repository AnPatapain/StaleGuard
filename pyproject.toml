[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "staleguard"
version = "0.1.0"
description = "Runtime assurance for queued UAV commands and scientific reproduction"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = ["numpy", "scipy", "matplotlib", "numba", "pybullet==3.2.7", "gymnasium>=0.28,<0.29", "torch", "casadi", "munch", "PyYAML", "dict-deep", "termcolor", "tensorboard", "imageio", "Pillow"]

[tool.setuptools.packages.find]
include = ["staleguard*", "safe_control_gym*"]
exclude = ["*.__pycache__*", "*.tests*", "*.results*"]
namespaces = true

[tool.setuptools.package-data]
safe_control_gym = ["**/*.yaml", "**/*.urdf", "**/*.obj", "**/*.mtl", "**/*.dae", "**/*.png", "**/*.jpg", "**/*.stl", "**/*.xml"]

[tool.setuptools.exclude-package-data]
"*" = ["tree.txt", "*.pyc", "*.nbi", "*.nbc"]
